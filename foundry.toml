[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
# Arc targets Osaka; Prague is the newest target this solc emits and is a subset.
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.io"
arc_mainnet = "https://rpc.mainnet.arc.io"

[fmt]
line_length = 120

[lint]
exclude_lints = ["require-revert-in-loop", "mixed-case-variable", "unwrapped-modifier-logic"]
